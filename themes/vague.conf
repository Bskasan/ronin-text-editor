# vague, ported to ronin from its Neovim color scheme (lua/vague/config/internal.lua and lua/vague/groups/*.lua, its
# default options) at the commit below. Only the color values and their names were taken; how each Neovim highlight
# group maps to a ronin key is written once in docs/ARCHITECTURE.md (Decisions, Phase 21).
#
# vague defines no PmenuSel and no StatusLineNC background: completion_selection and modal_selection follow
# selection, mode_line_inactive_background follows background. It defines no Cursor: Neovim draws the cursor in
# reverse video, the text color.

[theme]
name    = vague
source  = https://github.com/vague-theme/vague.nvim
commit  = 73f8aaa866bf3d14dd0b0ab9e48c11794c1cb7ab
license = MIT (Copyright (c) 2024 Alberto Hernandez)
author  = Alberto Hernandez (vague2k)

[colors]
# Normal, Cursor (reverse video), Visual
background = #141415
text       = #cdcdcd
cursor     = #cdcdcd
selection  = #333738
# Comment, String, Keyword, Number, Boolean, Type, Identifier, Function, PreProc
comment    = #606079
string     = #e8b589
keyword    = #6e94b2
number     = #e0a363
constant   = #e0a363
type       = #9bb4bc
variable   = #aeaed1
function   = #c48282
directive  = #6e94b2
# MatchParen
paren_match = #333738
# Question, CmpItemAbbrMatch
prompt           = #aeaed1
completion_match = #f3be7c
# CurSearch, Search, DiffDelete
isearch        = #405065
isearch_text   = #cdcdcd
lazy_highlight = #405065
isearch_fail   = #3b242a
# WinSeparator, StatusLine, StatusLineNC
window_divider          = #878787
mode_line_background    = #1c1c24
mode_line_text          = #cdcdcd
mode_line_inactive_text = #606079
# Directory, LineNr
search_file        = #7e98e8
search_line_number = #606079
# DiagnosticError, DiagnosticWarn, DiagnosticInfo
compilation_error   = #d8647e
compilation_warning = #f3be7c
compilation_info    = #aeaed1
# NormalFloat, WinSeparator (no FloatBorder), Comment, Special
modal_background  = #1c1c24
modal_border      = #878787
modal_description = #606079
modal_key         = #b4d4cf
# diffAdded (Added), diffRemoved (Removed), diffLine (Statement), diffFile (Type), Changed
diff_added   = #7fa563
diff_removed = #d8647e
diff_hunk    = #6e94b2
diff_header  = #9bb4bc
git_status   = #f3be7c
