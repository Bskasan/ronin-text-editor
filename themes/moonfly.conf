# moonfly, ported to ronin from its Neovim color scheme (lua/moonfly/init.lua, its default options) at the commit
# below. Only the color values and their names were taken; how each Neovim highlight group maps to a ronin key is
# written once in docs/ARCHITECTURE.md (Decisions, Phase 21). Every ronin key has a group here.

[theme]
name    = moonfly
source  = https://github.com/bluz71/vim-moonfly-colors
commit  = 2c883835f5b7b380a0a9e80695c420f7efebdfe4
license = MIT (Copyright (c) 2017-present vim-moonfly-colors authors)
author  = bluz71

[colors]
# Normal, Cursor, Visual
background = #080808
text       = #c6c6c6
cursor     = #9e9e9e
selection  = #323437
# Comment, String, Statement (Keyword), Constant (Number), Boolean, Type, Identifier, Function, PreProc
comment    = #949494
string     = #c6c684
keyword    = #cf87e8
number     = #de935f
constant   = #e65e72
type       = #36c692
variable   = #79dac8
function   = #74b2ff
directive  = #e65e72
# MatchParen
paren_match = #323437
# Question, PmenuSel, CmpItemAbbrMatch
prompt               = #85dc85
completion_selection = #4d5d8d
completion_match     = #e9958e
# CurSearch, Search, DiffDelete
isearch        = #f09479
isearch_text   = #080808
lazy_highlight = #373c4d
isearch_fail   = #2e2e2e
# WinSeparator (VertSplit), StatusLine, StatusLineNC
window_divider                = #292929
mode_line_background          = #292929
mode_line_text                = #c6c6c6
mode_line_inactive_background = #292929
mode_line_inactive_text       = #9e9e9e
# Directory, LineNr
search_file        = #80a0ff
search_line_number = #626262
# DiagnosticError, DiagnosticWarn, DiagnosticInfo
compilation_error   = #ff5d5d
compilation_warning = #e3c78a
compilation_info    = #74b2ff
# NormalFloat, FloatBorder, PmenuSel, Comment, Special
modal_background  = #212121
modal_border      = #444444
modal_selection   = #4d5d8d
modal_description = #949494
modal_key         = #e65e72
# diffAdded, diffRemoved, diffLine, diffFile (Type), GitSignsChange
diff_added   = #8cc85f
diff_removed = #ff5d5d
diff_hunk    = #74b2ff
diff_header  = #36c692
git_status   = #74b2ff
