# ronin's own colors, the default theme: after Jonathan Blow's Emacs setup (the naysayer-theme for Emacs and the
# Witness color scheme served as references). Every other theme lies on top of this one: a key a theme leaves out
# keeps the color below, or follows the key it derives from (see the [colors] section of the built-in
# configuration, which C-c , writes into ronin.conf).
#
# The keys that derive are left out here, so a theme that leaves them out too gets them from its own colors:
# constant, function, directive, prompt, completion_selection, completion_match, compilation_info, mode_line_*,
# search_file, search_line_number, modal_selection, modal_key, diff_hunk, diff_header, git_status.

[theme]
name    = ronin
source  = https://github.com/Bskasan/ronin-text-editor
license = MIT
author  = Bekir Kasan (colors after Jonathan Blow's Emacs setup)

[colors]
background = #072626
text       = #d3b58d
cursor     = #90ee90
selection  = #0000ff
comment    = #3fdf1f
string     = #0fdfaf
keyword    = #ffffff
number     = #7ad0c6
type       = #8cde94
variable   = #c1d1e3

paren_match = #4f94cd

isearch        = #cd00cd
isearch_text   = #b0e2ff
lazy_highlight = #668b8b
isearch_fail   = #8b0000

window_divider = #126367

compilation_error   = #ff0000
compilation_warning = #ffaa00

modal_background  = #0c3434
modal_border      = #2e8b8b
modal_description = #a8977a

diff_added   = #73e673
diff_removed = #ff6e6e
