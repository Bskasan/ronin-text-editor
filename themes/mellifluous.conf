# mellifluous, ported to ronin from its Neovim color scheme (its default colorset, mellifluous, dark) at the commit
# below. Only the color values and their names were taken; how each Neovim highlight group maps to a ronin key is
# written once in docs/ARCHITECTURE.md (Decisions, Phase 21). Every ronin key has a group here.
#
# mellifluous writes no color values: it computes them from OkHSL when it loads. They were computed by its own code:
# NVIM v0.11.5 (already installed; nothing was installed for this), the plugin at the commit below shallow-fetched
# into a scratch folder outside the repository (deleted afterwards), and in that folder the exact command:
#
# nvim --clean --headless --cmd "set rtp^=mellifluous" -c "set termguicolors" -c "colorscheme mellifluous" -c "runtime syntax/diff.vim" -c 'lua for _, g in ipairs({"Normal","Cursor","Visual","Comment","String","Keyword","Number","Boolean","Type","Identifier","Function","PreProc","MatchParen","Question","Title","PmenuSel","PmenuMatch","CmpItemAbbrMatch","BlinkCmpLabelMatch","CurSearch","IncSearch","Search","DiffDelete","WinSeparator","StatusLine","StatusLineNC","Directory","LineNr","DiagnosticError","DiagnosticWarn","DiagnosticInfo","DiagnosticOk","NormalFloat","Pmenu","FloatBorder","Special","diffAdded","diffRemoved","Added","Removed","GitSignsAdd","GitSignsDelete","GitGutterAdd","GitGutterDelete","diffLine","Changed","diffFile","GitSignsChange"}) do local h = vim.api.nvim_get_hl(0, {name = g, link = false}); io.stdout:write(g, " fg=", h.fg and string.format("#%06x", h.fg) or "-", " bg=", h.bg and string.format("#%06x", h.bg) or "-", (h.reverse and " reverse" or ""), "\n") end' -c "qa!"
#
# Its CurSearch has a background and no foreground: the text keeps the Normal color (isearch_text). Its FloatBorder
# is drawn in the float's own background (invisible): modal_border is WinSeparator.

[theme]
name    = mellifluous
source  = https://github.com/ramojus/mellifluous.nvim
commit  = ec0575bdb63594c5e7fba6eb9607b009aa1fb74e
license = MIT (Copyright (c) 2024 Ramojus Lapinskas)
author  = Ramojus Lapinskas

[colors]
# Normal, Cursor, Visual
background = #1a1a1a
text       = #dadada
cursor     = #cbaa88
selection  = #2d2d2d
# Comment, String, Keyword, Number, Boolean, Type, Identifier, Function, PreProc
comment    = #737246
string     = #bfaf8e
keyword    = #cbaa88
number     = #b99bb5
constant   = #b99bb5
type       = #bfad9d
variable   = #dadada
function   = #a8a1be
directive  = #a8a1be
# MatchParen
paren_match = #2d2d2d
# Question, PmenuSel, CmpItemAbbrMatch
prompt               = #cbaa88
completion_selection = #3b3b3b
completion_match     = #dadada
# CurSearch (text: Normal), Search, DiffDelete
isearch        = #3b372f
isearch_text   = #dadada
lazy_highlight = #3b372f
isearch_fail   = #3d2425
# WinSeparator, StatusLine, StatusLineNC
window_divider                = #4d4d4d
mode_line_background          = #2d2d2d
mode_line_text                = #aeaeae
mode_line_inactive_background = #242424
mode_line_inactive_text       = #5b5b5b
# Directory, LineNr
search_file        = #a8a1be
search_line_number = #5b5b5b
# DiagnosticError, DiagnosticWarn, DiagnosticInfo
compilation_error   = #be7c7d
compilation_warning = #aa8a69
compilation_info    = #938ca8
# NormalFloat, WinSeparator (FloatBorder invisible), PmenuSel, Comment, Special
modal_background  = #282828
modal_border      = #4d4d4d
modal_selection   = #3b3b3b
modal_description = #737246
modal_key         = #cbaa88
# diffAdded, diffRemoved, diffLine, diffFile, GitSignsChange
diff_added   = #939374
diff_removed = #be7c7d
diff_hunk    = #cbaa88
diff_header  = #bfad9d
git_status   = #b07534
