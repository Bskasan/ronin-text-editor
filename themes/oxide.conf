# oxide, ported to ronin from its Neovim color scheme (lua/oxide/colors.lua and lua/oxide/highlights/*.lua, its
# default options) at the commit below. Only the color values and their names were taken; how each Neovim highlight
# group maps to a ronin key is written once in docs/ARCHITECTURE.md (Decisions, Phase 21).
#
# oxide defines no group for two keys, which are left out: completion_match (no PmenuMatch, CmpItemAbbrMatch or
# BlinkCmpLabelMatch: it follows keyword) and git_status (no GitSignsChange or Changed: it follows string). It has
# no group for diff_added either (no diffAdded, Added, GitSignsAdd, DiagnosticOk or GitGutterAdd); that key takes
# the palette's documented "added" green instead (decided with the user, Phase 22).

[theme]
name    = oxide
source  = https://github.com/oxidescheme/nvim
commit  = 838760c820821cce6a79706430883439c80dad4c
license = MIT (Copyright (c) 2025 oxidescheme)
author  = oxidescheme (Neovim port by jakmaz)

[colors]
# Normal, Cursor, Visual
background = #161616
text       = #cecece
cursor     = #cecece
selection  = #2e2e2e
# Comment, String, Keyword, Number, Boolean, Type, Identifier, Function, PreProc (Keyword)
comment    = #808080
string     = #5bb661
keyword    = #968ff7
number     = #e48233
constant   = #e48233
type       = #00b3d6
variable   = #cecece
function   = #00baaa
directive  = #968ff7
# MatchParen
paren_match = #555555
# Title (no Question), PmenuSel
prompt               = #cecece
completion_selection = #2e2e2e
# CurSearch, Search, DiffDelete
isearch        = #e48233
isearch_text   = #161616
lazy_highlight = #3ba6f5
isearch_fail   = #452b28
# WinSeparator, StatusLine, StatusLineNC
window_divider                = #3a3a3a
mode_line_background          = #121212
mode_line_text                = #aeaeae
mode_line_inactive_background = #161616
mode_line_inactive_text       = #aeaeae
# Directory, LineNr
search_file        = #3ba6f5
search_line_number = #555555
# DiagnosticError, DiagnosticWarn, DiagnosticInfo
compilation_error   = #ed756e
compilation_warning = #e48233
compilation_info    = #3ba6f5
# NormalFloat, FloatBorder, PmenuSel, Comment, Special
modal_background  = #161616
modal_border      = #3a3a3a
modal_selection   = #2e2e2e
modal_description = #808080
modal_key         = #cecece
# green (lua/oxide/colors.lua:26, "Strings, success, added items"; no diff group), DiagnosticError (no diff
# group), diffLine (Statement), diffFile (Type)
diff_added   = #5bb661
diff_removed = #ed756e
diff_hunk    = #968ff7
diff_header  = #00b3d6
